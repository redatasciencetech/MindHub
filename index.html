<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindHub - Meu Hub de Estudos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importação oficial do SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        /* Esconde a barra de rolagem visual do sistema para manter o design clean */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-emerald-500 selection:text-white">

    <!-- ================= TELA DE LOGIN / CADASTRO ================= -->
    <div id="tela-autenticacao" class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
        <div class="w-full max-w-md space-y-6 bg-white p-8 rounded-2xl border border-slate-200 shadow-xl">
            <div class="text-center space-y-2">
                <span class="text-4xl">🧠</span>
                <h2 class="text-2xl font-extrabold text-slate-900">Bem-vindo ao MindHub</h2>
                <p class="text-sm text-slate-400">Organize seus vídeos do YouTube e PDFs na nuvem</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">E-mail</label>
                    <input type="email" id="auth-email" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500 text-sm">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Senha</label>
                    <input type="password" id="auth-senha" class="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-emerald-500 text-sm">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="handleLogin()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-lg text-sm transition">Entrar</button>
                    <button onclick="handleCadastro()" class="flex-1 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-medium py-2 rounded-lg text-sm transition">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= DASHBOARD PRINCIPAL ================= -->
    <div id="painel-principal" class="hidden h-screen overflow-hidden">
        <div class="flex h-screen w-full">
            
            <!-- PAINEL LATERAL (SIDEBAR) - VISÍVEL APENAS EM PC/TABLET -->
            <aside class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 p-5 justify-between">
                <div>
                    <div class="flex items-center justify-between mb-5">
                        <div class="flex items-center gap-2 px-1 py-3">
                            <span class="text-2xl">🧠</span>
                            <h1 class="text-xl font-bold tracking-tight text-slate-900">MindHub</h1>
                        </div>
                    </div>

                    <button onclick="adicionarCategoria()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 px-4 rounded-lg transition mb-6 flex items-center justify-center gap-2 text-sm shadow-sm">
                        <span class="text-lg font-light">+</span> Nova Categoria
                    </button>

                    <nav class="space-y-1">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-2 mb-2">Minhas Trilhas</p>
                        <div id="lista-categorias" class="space-y-1"></div>
                    </nav>
                </div>

                <!-- Rodapé da Sidebar -->
                <div class="border-t border-slate-100 pt-4 flex items-center justify-between">
                    <div class="flex items-center gap-2 min-w-0">
                        <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold text-sm shrink-0" id="avatar-usuario">U</div>
                        <div class="min-w-0">
                            <p class="text-xs font-semibold text-slate-900 truncate" id="email-usuario">usuario@teste.com</p>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="text-xs text-red-500 hover:text-red-700 font-medium ml-2">Sair</button>
                </div>
            </aside>

            <!-- ÁREA DE CONTEÚDO PRINCIPAL (PC E CELULAR) -->
            <main class="flex-1 flex flex-col bg-slate-50 overflow-y-auto">
                
                <!-- TOPBAR RESPONSIVA -->
                <header class="flex items-center justify-between p-4 border-b border-slate-200 bg-white sticky top-0 z-20">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">🧠</span>
                        <h1 class="text-lg font-bold text-slate-900">MindHub</h1>
                    </div>
                    <div class="hidden md:block text-xs font-medium text-slate-400 uppercase tracking-wider">
                        Conectado à Nuvem do Supabase
                    </div>
                    <button onclick="handleLogout()" class="text-xs text-red-500 font-semibold bg-red-50 hover:bg-red-100 px-3 py-1 rounded-lg transition">Sair</button>
                </header>

                <!-- BARRA DE CATEGORIAS EXCLUSIVA PARA CELULAR (Fica oculta no PC) -->
                <div class="md:hidden bg-white border-b border-slate-200 p-3 sticky top-[57px] z-10 flex items-center gap-2 overflow-x-auto whitespace-nowrap no-scrollbar">
                    <button onclick="adicionarCategoria()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-1.5 px-3 rounded-lg shrink-0 shadow-sm">
                        + Nova Categoria
                    </button>
                    <!-- Divisória sutil -->
                    <div class="h-4 w-[1px] bg-slate-200 shrink-0 mx-1"></div>
                    <!-- Área onde o JavaScript vai injetar os botões de categorias no celular -->
                    <div id="lista-categorias-mobile" class="flex items-center gap-1.5"></div>
                </div>

                <!-- CORPO DO PAINEL DE CONTEÚDOS -->
                <div class="max-w-4xl w-full mx-auto p-4 md:p-8 space-y-6">
                    
                    <!-- CABEÇALHO DA TRILHA ATIVA -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <div>
                            <span class="text-xs font-bold text-emerald-600 uppercase tracking-wide block mb-1">Trilha de Estudos</span>
                            <h2 id="titulo-categoria-ativa" class="text-2xl font-extrabold text-slate-900 flex items-center gap-2">Selecione uma trilha</h2>
                        </div>
                        
                        <!-- BARRA DE PROGRESSO -->
                        <div class="w-full sm:w-64 space-y-1.5">
                            <div class="flex justify-between text-xs font-semibold">
                                <span class="text-slate-400">Progresso Geral</span>
                                <span id="texto-progresso" class="text-emerald-600">0% concluído</span>
                            </div>
                            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div id="barra-progresso" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- BARRA DE AÇÃO RAPIDA DO CONTEÚDO -->
                    <div class="flex items-center justify-between text-xs font-medium text-slate-400 uppercase tracking-wider border-b border-slate-200 pb-2 px-1">
                        <span>Fluxo de Conteúdos Sequencial</span>
                        <button onclick="adicionarConteudo()" class="text-emerald-600 hover:text-emerald-700 font-bold flex items-center gap-1 transition normal-case text-sm">+ Adicionar Conteúdo</button>
                    </div>

                    <!-- LISTA DE CARDS REAL -->
                    <div id="lista-conteudos" class="space-y-3"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- ================= CONFIGURAÇÃO E LÓGICA SUPABASE ================= -->
    <script>
        const SUPABASE_URL = 'https://wjcdcuxvweguzdbatvtz.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_WUEPQDtOgAd71hpTPJr_Fg_e_fF31TK';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let usuarioLogado = null;
        let categoriasCache = [];
        let categoriaAtivaId = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                configurarSessao(session.user);
            } else {
                mostrarTelaLogin();
            }
        });

        function configurarSessao(user) {
            usuarioLogado = user;
            document.getElementById('tela-autenticacao').classList.add('hidden');
            document.getElementById('painel-principal').classList.remove('hidden');
            document.getElementById('email-usuario').innerText = user.email;
            document.getElementById('avatar-usuario').innerText = user.email.charAt(0).toUpperCase();
            carregarCategorias();
        }

        function mostrarTelaLogin() {
            document.getElementById('painel-principal').classList.add('hidden');
            document.getElementById('tela-autenticacao').classList.remove('hidden');
        }

        async function handleCadastro() {
            const email = document.getElementById('auth-email').value;
            const senha = document.getElementById('auth-senha').value;
            const { data, error } = await supabaseClient.auth.signUp({ email, password: senha });
            
            if (error) alert("Erro no cadastro: " + error.message);
            else alert("Cadastro realizado com sucesso! Você já pode clicar em Entrar.");
        }

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const senha = document.getElementById('auth-senha').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
            
            if (error) alert("Erro no login: " + error.message);
            else configurarSessao(data.user);
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            usuarioLogado = null;
            mostrarTelaLogin();
        }

        // CARREGA AS CATEGORIAS PARA OS DOIS LAYOUTS (PC E CELULAR)
        async function carregarCategorias() {
            const { data, error } = await supabaseClient.from('categories').select('*').order('nome');
            if (error) return console.error(error);
            
            categoriasCache = data;
            const containerDesktop = document.getElementById('lista-categorias');
            const containerMobile = document.getElementById('lista-categorias-mobile');
            
            containerDesktop.innerHTML = '';
            containerMobile.innerHTML = '';

            if(data.length > 0 && !categoriaAtivaId) {
                categoriaAtivaId = data[0].id;
            }

            data.forEach(cat => {
                const ehAtiva = cat.id === categoriaAtivaId;
                
                // Injeta na Sidebar do Computador
                containerDesktop.innerHTML += `
                    <div onclick="selecionarCategoria('${cat.id}')" class="flex items-center justify-between ${ehAtiva ? 'bg-emerald-50 text-emerald-700' : 'text-slate-600 hover:bg-slate-50'} px-3 py-2.5 rounded-lg font-medium transition cursor-pointer">
                        <span class="flex items-center gap-2"><span>${cat.icone || '📁'}</span> ${cat.nome}</span>
                    </div>
                `;

                // Injeta na Barra Horizontal do Celular
                containerMobile.innerHTML += `
                    <button onclick="selecionarCategoria('${cat.id}')" class="text-xs font-semibold px-3 py-1.5 rounded-lg transition shrink-0 ${ehAtiva ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200'}">
                        ${cat.icone || '📁'} ${cat.nome}
                    </button>
                `;
            });
            carregarConteudos();
        }

        async function carregarConteudos() {
            const container = document.getElementById('lista-conteudos');
            const tituloCabecalho = document.getElementById('titulo-categoria-ativa');
            container.innerHTML = '';

            if (!categoriaAtivaId) {
                tituloCabecalho.innerText = "Crie uma categoria para começar";
                return;
            }

            const catAtiva = Cancer = categoriesCache = nutritionalCache = categoriasCache.find(c => c.id === categoriaAtivaId);
            if (catAtiva) tituloCabecalho.innerHTML = `<span>${catAtiva.icone}</span> ${catAtiva.nome}`;

            const { data: itens, error } = await supabaseClient.from('contents').select('*').eq('categoria_id', categoriaAtivaId).order('ordem');
            if (error) return console.error(error);

            if (itens.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400 text-center py-8">Nenhum conteúdo adicionado aqui ainda.</p>`;
                atualizarProgresso(0);
                return;
            }

            const concluidos = itens.filter(i => i.status === 'concluido').length;
            atualizarProgresso(Math.round((concluidos / itens.length) * 100));

            itens.forEach((item, index) => {
                const num = String(index + 1).padStart(2, '0');
                const isVideo = item.tipo === 'video';
                const tag = isVideo ? `<span class="inline-flex items-center gap-1 text-[11px] font-bold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-100 mb-1.5">🎬 VÍDEO</span>` : `<span class="inline-flex items-center gap-1 text-[11px] font-bold bg-amber-50 text-amber-700 px-2 py-0.5 rounded border border-amber-100 mb-1.5">📄 PDF</span>`;
                
                let btnText = item.status === 'concluido' ? 'Reabrir' : (isVideo ? 'Iniciar Vídeo' : 'Abrir PDF');
                let nextStatus = item.status === 'concluido' ? 'pendente' : 'concluido';
                let statusBadge = item.status === 'concluido' ? `<span class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-2 py-1 rounded border border-emerald-200">Concluído</span>` : `<span class="text-xs font-medium text-slate-400 bg-slate-50 px-2 py-1 rounded border border-slate-100">Pendente</span>`;

                container.innerHTML += `
                    <div class="flex items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 hover:border-slate-300 transition shadow-sm">
                        <div class="text-slate-300 font-mono font-bold text-lg px-1">${num}</div>
                        <div class="flex-1 min-w-0 sm:flex sm:items-center sm:justify-between gap-4">
                            <div class="min-w-0">
                                ${tag}
                                <h3 class="text-base font-semibold text-slate-800 truncate">${item.titulo}</h3>
                                <p class="text-xs text-slate-400 mt-0.5 truncate">${item.autor_canal || 'Sem autor'} • <a href="${item.url_arquivo}" target="_blank" class="text-emerald-600 hover:underline">Acessar link original</a></p>
                            </div>
                            <div class="flex items-center gap-3 mt-3 sm:mt-0 justify-end">
                                ${statusBadge}
                                <button onclick="alterarStatus('${item.id}', '${nextStatus}')" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium py-1.5 px-3 rounded-lg transition whitespace-nowrap shadow-sm">${btnText}</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function selecionarCategoria(id) {
            categoriaAtivaId = id;
            carregarCategorias();
        }

        function atualizarProgresso(porcentagem) {
            document.getElementById('texto-progresso').innerText = `${porcentagem}% concluído`;
            document.getElementById('barra-progresso').style.width = `${porcentagem}%`;
        }

        async function adicionarCategoria() {
            const nome = prompt("Nome da nova categoria (ex: Psicologia):");
            if (!nome) return;
            const icone = prompt("Insira um emoji para a categoria:", "📁");

            const { data, error } = await supabaseClient.from('categories').insert([{ user_id: usuarioLogado.id, nome, icone }]).select();
            if (error) alert(error.message);
            else {
                categoriaAtivaId = data[0].id;
                carregarCategorias();
            }
        }

        async function adicionarConteudo() {
            if (!categoriaAtivaId) return alert("Crie ou selecione uma categoria primeiro.");
            const titulo = prompt("Título do conteúdo:");
            if (!titulo) return;
            const tipo = prompt("Tipo (digite 'video' ou 'pdf'):").toLowerCase();
            if (tipo !== 'video' && tipo !== 'pdf') return alert("Tipo inválido!");
            const url = prompt("Cole o Link completo (do YouTube ou do arquivo PDF):");
            if (!url) return;
            const autor = prompt("Nome do Canal ou Autor (Opcional):", tipo === 'video' ? 'Canal do YouTube' : 'Autor');

            const { data: existentes } = await supabaseClient.from('contents').select('id').eq('categoria_id', categoriaAtivaId);
            const ordem = (existentes?.length || 0) + 1;

            const { error } = await supabaseClient.from('contents').insert([{
                categoria_id: categoriaAtivaId,
                user_id: usuarioLogado.id,
                titulo,
                tipo,
                url_arquivo: url,
                autor_canal: autor,
                ordem
            }]);

            if (error) alert(error.message);
            else carregarConteudos();
        }

        async function alterarStatus(idItem, novoStatus) {
            const { error } = await supabaseClient.from('contents').update({ status: novoStatus }).eq('id', idItem);
            if (error) console.error(error);
            else carregarConteudos();
        }
    </script>
</body>
</html>
